version: '3.8'

services:
  # Next.js OmniBrand OS Web Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnibrand_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://omnibrand:omnibrand_secret@postgres:5432/omnibrand_db?schema=public
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=omnibrand-media-assets
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - AUTH_SECRET=omnibrand_super_secure_auth_session_secret_2026_change_in_prod
      - KMS_MASTER_KEY_V1=omnibrand_kms_key_v1_secure_2026_change_in_prod
      - KMS_MASTER_KEY_V2=omnibrand_kms_key_v2_rotated_2026_change_in_prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  # PostgreSQL Database (Supabase compatible)
  postgres:
    image: postgres:16-alpine
    container_name: omnibrand_postgres
    restart: always
    environment:
      POSTGRES_USER: omnibrand
      POSTGRES_PASSWORD: omnibrand_secret
      POSTGRES_DB: omnibrand_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/postgresql-rls-policies.sql:/docker-entrypoint-initdb.d/01-rls.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnibrand -d omnibrand_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (BullMQ Queues & Fast Idempotency Cache)
  redis:
    image: redis:7-alpine
    container_name: omnibrand_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible Object Storage for Media & Resized Derivatives)
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: omnibrand_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
